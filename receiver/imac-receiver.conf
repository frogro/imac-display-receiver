# Fixed mode is used only when AUTO_MODE=0. Start hardware bring-up with SDR.
DEVICE=auto
WIDTH=1920
HEIGHT=1080
FPS=60/1
FORMAT=NV12
IO_MODE=mmap
DRIVER=amdgpu
CONNECTOR_ID=
BUS_ID=
# This iMac exposes RGB primary planes, not an NV12 overlay plane.
DISPLAY_FORMAT=BGRx
FORCE_MODESETTING=1
AUTO_MODE=1
# Convert into ordinary RAM, then let kmssink copy into its display buffer.
# On this iMac this is faster than CPU conversion directly into the KMS pool.
CONVERT_THREADS=4
CACHED_OUTPUT=1

# Driver source-change events avoid repeated HDMI hardware queries.
# With working events, avoid periodic hardware reads; watchdog stays active.
# If event support fails, the receiver falls back to 2-second polling.
MODE_MONITOR=events
MODE_CHECK_INTERVAL=0
# Enable only after installing the version-checked private bundle. CPU settings
# above remain intact for automatic fallback. See docs/gpu-rollout-20261115.md.
GPU_ENABLED=0
GPU_BUNDLE=/opt/imac-receiver/experimental/gpu-dmabuf-20261115
