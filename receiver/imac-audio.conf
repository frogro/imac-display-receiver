# Linear amplitude, NOT a percentage UI: 0.10 = -20 dB.
# Start quietly; hardware PCM has no master playback-volume control.
# Permitted range 0..0.25; restart imac-audio after changing.
AUDIO_VOLUME=0.10
# Tweeter branch amplitude; 0.63 is 1.51 dB below the initial LR4 value 0.75.
AUDIO_TWEETER_GAIN=0.63
