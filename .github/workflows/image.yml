name: Build complete USB image
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring gdisk dosfstools e2fsprogs parted curl qemu-system-x86 ovmf
      - name: Build new rootfs, drivers, GPU library and UEFI image
        shell: bash
        run: |
          set -o pipefail
          sudo bash tools/build-image.sh /var/tmp/imac-receiver-build 2>&1 | tee image-build.log
      - name: Collect build report
        if: always()
        run: |
          mkdir -p report
          cp image-build.log report/ 2>/dev/null || true
          sudo cp /var/tmp/imac-receiver-build/{image-manifest.json,packages.tsv,BUILD-INFO.json} report/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-report
          path: report/
          retention-days: 14
      # No prebuilt OS is published automatically. Build locally for installation;
      # binary redistribution also requires the corresponding package sources.
